version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always

    environment:
      POSTGRES_DB: userservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq

    restart: always

    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    image: quay.io/keycloak/keycloak:26.2

    container_name: keycloak

    command: start-dev

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    ports:
      - "9090:8080"

    depends_on:
      - postgres

  userservice:

    build: .

    container_name: userservice

    depends_on:
      - postgres
      - rabbitmq

    ports:
      - "8080:8080"

    environment:

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userservice
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      JWT_SECRET: mysupersecretkeymysupersecretkey88888888

      KEYCLOAK_SERVER_URL: http://keycloak:8080

      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/myrealm

      KEYCLOAK_REALM: myrealm

      KEYCLOAK_CLIENT_ID: myclient

      KEYCLOAK_CLIENT_SECRET: mysecret

      KEYCLOAK_REDIRECT_URI: http://localhost:8080/auth/oidc-callback

volumes:

  postgres-data: